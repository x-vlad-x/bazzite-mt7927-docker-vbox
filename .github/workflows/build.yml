name: Build, verify, publish, and sign

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  IMAGE_NAME: bazzite-mt7927-docker-vbox
  IMAGE_REGISTRY: ghcr.io/x-vlad-x
  BASE_IMAGE: ghcr.io/ublue-os/bazzite-nvidia-open:stable
  DEFAULT_TAG: stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive

      - name: Reclaim runner disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Install container tools when missing
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for package in podman skopeo; do
            command -v "${package}" >/dev/null || missing+=("${package}")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3

      - name: Validate repository scripts
        run: just check

      - name: Resolve the base image digest
        id: base
        shell: bash
        run: |
          set -euo pipefail
          digest="$(skopeo inspect "docker://${BASE_IMAGE}" | jq -r .Digest)"
          pinned="${BASE_IMAGE%@*}@${digest}"
          echo "pinned=${pinned}" >> "${GITHUB_OUTPUT}"
          echo "Using ${pinned}"

      - name: Build the bootc image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056
        with:
          containerfiles: Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.DEFAULT_TAG }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.pinned }}
          labels: |
            containers.bootc=1
            org.opencontainers.image.description=Bazzite KDE with NVIDIA open modules, MT7927, Docker Engine, and prebuilt VirtualBox host modules
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.vendor=x-vlad-x

      - name: Verify image contents and kernel modules
        run: build_files/verify-image.sh "${IMAGE_NAME}:${DEFAULT_TAG}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified stable image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          destination="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          podman push \
            --authfile="${HOME}/.docker/config.json" \
            --digestfile=/tmp/image-digest \
            "${IMAGE_NAME}:${DEFAULT_TAG}" \
            "${destination}"
          echo "digest=$(</tmp/image-digest)" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.3

      - name: Sign the published digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          image="${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          if [[ -n "${COSIGN_PRIVATE_KEY}" ]]; then
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${image}"
          else
            cosign sign --yes "${image}"
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${image}"
          fi
