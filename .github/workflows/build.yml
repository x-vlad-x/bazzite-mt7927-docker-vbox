name: Build, verify, publish, and sign

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

env:
  IMAGE_NAME: bazzite-mt7927-docker-vbox
  IMAGE_REGISTRY: ghcr.io/x-vlad-x
  BASE_IMAGE: ghcr.io/ublue-os/bazzite-nvidia-open:stable
  DEFAULT_TAG: stable
  CONTAINER_RUNTIME: runc

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive

      - name: Reclaim runner disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install container tools when missing
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for package in podman skopeo "${CONTAINER_RUNTIME}"; do
            command -v "${package}" >/dev/null || missing+=("${package}")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: Report container tool versions
        shell: bash
        run: |
          set -euo pipefail
          podman --version
          skopeo --version
          "${CONTAINER_RUNTIME}" --version
          podman info --format 'Podman default OCI runtime: {{.Host.OCIRuntime.Name}}'

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3

      - name: Validate repository scripts
        run: just check

      - name: Resolve the base image digest
        id: base
        shell: bash
        run: |
          set -euo pipefail
          digest="$(skopeo inspect "docker://${BASE_IMAGE}" | jq -r .Digest)"
          pinned="${BASE_IMAGE%@*}@${digest}"
          echo "pinned=${pinned}" >> "${GITHUB_OUTPUT}"
          echo "Using ${pinned}"

      - name: Build the bootc image
        shell: bash
        run: |
          set -euo pipefail
          podman build \
            --runtime "${CONTAINER_RUNTIME}" \
            --build-arg "BASE_IMAGE=${{ steps.base.outputs.pinned }}" \
            --label "containers.bootc=1" \
            --label "org.opencontainers.image.description=Bazzite KDE with NVIDIA open modules, MT7927, Docker Engine, and prebuilt VirtualBox host modules" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.title=${IMAGE_NAME}" \
            --label "org.opencontainers.image.vendor=x-vlad-x" \
            --tag "${IMAGE_NAME}:${DEFAULT_TAG}" \
            .

      - name: Verify image contents and kernel modules
        run: build_files/verify-image.sh "${IMAGE_NAME}:${DEFAULT_TAG}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified stable image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          destination="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          podman push \
            --authfile="${HOME}/.docker/config.json" \
            --digestfile=/tmp/image-digest \
            "${IMAGE_NAME}:${DEFAULT_TAG}" \
            "${destination}"
          echo "digest=$(</tmp/image-digest)" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.3

      - name: Sign the published digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          image="${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          if [[ -n "${COSIGN_PRIVATE_KEY}" ]]; then
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${image}"
          else
            cosign sign --yes "${image}"
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${image}"
          fi

  report-build-status:
    name: Report build status
    needs:
      - build
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write

    steps:
      - name: Create, update, or close the build failure issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          EVENT_NAME: ${{ github.event_name }}
          REVISION: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = "<!-- stable-image-build-failure -->";
            const title = "[CI] Stable image build failed";
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                ...context.repo,
                state: "open",
                per_page: 100,
              },
            );
            const issue = issues.find(
              (item) =>
                !item.pull_request &&
                item.title === title &&
                item.body?.includes(marker),
            );

            if (process.env.BUILD_RESULT === "failure") {
              const shortRevision = process.env.REVISION.slice(0, 12);
              const body = `${marker}
            The stable image workflow failed and did not publish a new image.

            - Result: \`${process.env.BUILD_RESULT}\`
            - Trigger: \`${process.env.EVENT_NAME}\`
            - Commit: [\`${shortRevision}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${process.env.REVISION})
            - Run: [Open the workflow logs](${process.env.RUN_URL})

            The existing \`stable\` GHCR tag remains unchanged. Review the failed step before retrying or changing kernel, MT7927, Docker, or VirtualBox dependencies.
            `;

              if (issue) {
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: issue.number,
                  body,
                  assignees: [context.repo.owner],
                });
              } else {
                await github.rest.issues.create({
                  ...context.repo,
                  title,
                  body,
                  assignees: [context.repo.owner],
                });
              }
            } else if (process.env.BUILD_RESULT === "success" && issue) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
            }
